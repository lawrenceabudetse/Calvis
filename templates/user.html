{% extends "base.html" %}

{% block title %}Profile - Calvis AI{% endblock %}

{% block content %}
<style>
    .profile-card {
        background: #0f172a;
        border: 1px solid rgba(56, 189, 248, 0.2);
        border-radius: 12px;
        padding: 35px 30px;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .profile-card h2 {
        font-size: 1.8rem;
        margin-bottom: 20px;
        color: #38bdf8;
        text-align: center;
    }

    .info-group {
        background: #080c14;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .info-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #64748b;
        margin-bottom: 4px;
    }

    .info-value {
        color: #f1f5f9;
        font-size: 1rem;
        font-weight: 600;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-size: 0.9rem;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 12px 14px;
        background: #080c14;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #f1f5f9;
        font-size: 1rem;
        outline: none;
    }

    .form-group input:focus {
        border-color: #38bdf8;
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .nav-actions {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 0.9rem;
    }

    .nav-actions a {
        color: #38bdf8;
        text-decoration: none;
    }

    .nav-actions a.logout {
        color: #f43f5e;
    }
</style>

<div class="profile-card">
    <h2>Update User Credentials</h2>

    <div class="info-group">
        <div class="info-label">Username</div>
        <div class="info-value">{{ user }}</div>
    </div>

    <form action="/user" method="POST">
        <div class="form-group">
            <label for="useremail">Email Address</label>
            <input type="email" id="useremail" name="useremail" value="{{ email if email else '' }}" placeholder="Enter email address" required>
        </div>
        <button type="submit" class="submit-btn">Update Profile</button>
    </form>

    <div class="nav-actions">
        <a href="/calvis">Talk to Calvis 🎙️</a>
        <a href="/logout" class="logout">Log Out</a>
    </div>
</div>
{% endblock %}
